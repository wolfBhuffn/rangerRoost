<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Space Grotesk', sans-serif;
      perspective: 1000px;
    }
    
    /* Heavy Extended Glitch & RGB Split Animation */
    @keyframes heavyGlitch {
      0% { transform: translate(0, 0) scale(1); filter: contrast(150%) brightness(100%); }
      10% { transform: translate(-8px, 4px) skew(-2deg); filter: contrast(200%) hue-rotate(45deg); }
      20% { transform: translate(8px, -4px) skew(3deg); filter: contrast(180%) invert(0.1); }
      30% { transform: translate(-4px, -8px) scale(1.02); filter: contrast(220%) hue-rotate(-60deg); }
      40% { transform: translate(6px, 6px); filter: contrast(150%) saturate(200%); }
      50% { transform: translate(-10px, 2px) skew(-5deg); filter: contrast(250%) invert(0.2); }
      60% { transform: translate(4px, -6px) scale(0.98); filter: contrast(190%) hue-rotate(90deg); }
      70% { transform: translate(-6px, 8px); filter: contrast(210%) saturate(150%); }
      80% { transform: translate(8px, -2px) skew(2deg); filter: contrast(170%) brightness(120%); }
      90% { transform: translate(-2px, -4px); filter: contrast(200%) hue-rotate(-30deg); }
      100% { transform: translate(0, 0) scale(1); filter: contrast(150%) brightness(100%); }
    }

    .glitch-heavy-active {
      animation: heavyGlitch 0.12s steps(2, end) infinite;
    }

    /* Scanlines overlay effect */
    .overlay-scanlines {
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.5) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 3px, 4px 100%;
    }

    /* 3D Smooth Interactive Card Styles */
    .bust-container {
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out;
    }
    
    .bust-image {
      transform: translateZ(40px);
      transition: transform 0.1s ease-out;
    }
  </style>
</head>
<body class="min-h-screen bg-[#0d0f12] text-[#e9e7df] antialiased flex flex-col justify-between overflow-hidden relative" id="sceneContainer">

  <!-- Fullscreen Extended Glitch Transition Overlay -->
  <div id="glitchOverlay" class="fixed inset-0 z-50 pointer-events-none opacity-0 transition-opacity duration-200 bg-black/95 flex flex-col items-center justify-center p-4">
    <div class="absolute inset-0 overlay-scanlines pointer-events-none"></div>
    <div id="glitchBox" class="relative w-56 h-56 md:w-72 md:h-72 mb-6 border border-lime-300/60 bg-black/80 p-2 overflow-hidden shadow-[0_0_30px_rgba(163,230,53,0.2)]">
      <img src="./assets/wolf_sheep_bust.png" alt="WOLFX__XSABYTERS" class="w-full h-full object-contain filter contrast-125" />
    </div>
    <div class="font-mono text-lime-300 text-xs md:text-sm tracking-[.35em] uppercase animate-pulse" id="glitchStatusText">
      [DISGUISE INITIALIZED] ENGAGING IDENTITY PROTOCOL...
    </div>
  </div>

  <!-- Minimal Covert Header Bar -->
  <header class="flex h-[72px] items-center justify-between border-b border-[#22272a] bg-[#0d0f12]/90 px-6 md:px-12 backdrop-blur z-20">
    <div class="flex items-center gap-3">
      <div class="relative grid h-8 w-8 place-items-center border border-lime-300/50 bg-lime-300/[.08] text-lime-300 font-mono font-bold text-xs">&gt;_</div>
      <div class="font-mono text-xs font-medium tracking-[.18em] text-[#efeee8]">RANGER<span class="text-lime-300">_ROOST</span></div>
    </div>
    <div class="flex items-center gap-2 font-mono text-[9px] tracking-[.25em] text-[#6b7370]">
      <span class="h-2 w-2 rounded-full bg-lime-300 animate-pulse"></span>
      CLASSIFIED OPERATOR NETWORK
    </div>
  </header>

  <!-- Interactive 3D Bust Centerpiece & Tactical Selections -->
  <main class="flex-1 flex flex-col items-center justify-center px-6 py-10 z-10">
    
    <!-- 3D Interactive Bust Wrapper -->
    <div class="bust-container relative w-64 h-64 sm:w-80 sm:h-80 md:w-96 md:h-96 mb-8 flex items-center justify-center border border-lime-300/20 bg-[#131619]/60 p-4 shadow-[0_0_50px_rgba(0,0,0,0.8)]" id="bustWrapper">
      <div class="absolute inset-0 bg-gradient-to-b from-transparent via-lime-300/[.02] to-transparent pointer-events-none"></div>
      
      <!-- Cleaned 3D Bust Image -->
      <img src="./assets/wolf_sheep_bust.png" alt="Wolf in Sheep's Clothing" class="bust-image w-full h-full object-contain filter contrast-125 drop-shadow-[0_10px_25px_rgba(0,0,0,0.9)]" id="bustImage" />
    </div>

    <!-- Covert Tactical Selections (James Bond / Alter-Ego Style Naming) -->
    <!-- Action Buttons Container -->
<div class="flex flex-col sm:flex-row items-center justify-center gap-4 mt-8">
  <!-- Operator Login Button -->
  <a href="./console.html" class="w-full sm:w-auto inline-flex items-center justify-center border border-lime-300/40 bg-lime-300/[.08] px-6 py-3 font-mono text-[10px] tracking-[.2em] text-lime-300 hover:bg-lime-300/[.18] hover:border-lime-300 transition uppercase shadow-[0_0_15px_rgba(163,230,53,0.1)]">

  <a href="./dashboard.html" class="w-full sm:w-auto inline-flex items-center justify-center border border-[#3a4041] bg-[#191d20] px-6 py-3 font-mono text-[10px] tracking-[.2em] text-[#d0d2cc] hover:border-lime-300 hover:text-lime-300 transition uppercase">

</div>


  </main>

  <!-- Footer status bar -->
  <footer class="border-t border-[#22272a] py-4 px-6 md:px-12 flex justify-between items-center font-mono text-[9px] tracking-[.18em] text-[#555d5a] z-20">
    <div>SYS_ID: RANGER_ROOST_A2</div>
    <div>WOLFX__XSABYTERS // 2026</div>
  </footer>

  <!-- 3D Parallax Tracking & Glitch Control Script -->
  <script>
    const container = document.getElementById('sceneContainer');
    const wrapper = document.getElementById('bustWrapper');
    const bustImg = document.getElementById('bustImage');

    // Smooth 3D Cursor Movement Logic
    container.addEventListener('mousemove', (e) => {
      const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
      const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
      
      wrapper.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
      bustImg.style.transform = `translateZ(60px) rotateY(${xAxis * 0.5}deg)`;
    });

    // Reset perspective on mouse leave
    container.addEventListener('mouseleave', () => {
      wrapper.style.transform = `rotateY(0deg) rotateX(0deg)`;
      bustImg.style.transform = `translateZ(40px) rotateY(0deg)`;
    });

    // Uniform 1.2s Glitch Overlay Trigger
    function triggerGlitch(event, targetUrl, statusMessage) {
      event.preventDefault();
      const overlay = document.getElementById('glitchOverlay');
      const box = document.getElementById('glitchBox');
      const statusText = document.getElementById('glitchStatusText');

      overlay.classList.remove('opacity-0', 'pointer-events-none');
      overlay.classList.add('opacity-100');
      box.classList.add('glitch-heavy-active');

      statusText.innerText = "[TACTICAL OVERRIDE] " + statusMessage + "...";

      setTimeout(() => {
        window.location.href = targetUrl;
      }, 1200);
    }
  </script>
</body>
</html>
